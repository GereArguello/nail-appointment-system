[project]
name = "manicura"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "psycopg[binary]",
    "pwdlib[argon2]",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel",
    "starlette",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "S",
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**/*.py" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "app/tests/*",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
